/* RIYA minimal dark-indigo redesign */
html,body{background:#171127;color:var(--ink)}
.app{max-width:440px;min-height:100dvh;background:linear-gradient(180deg,#171127 0%,#211936 100%);border-left:1px solid #33284f;border-right:1px solid #33284f}
.header{background:#171127;border-bottom:1px solid #33284f;padding:16px 20px 12px}
.brand{gap:11px}.logo{background:#392d62;color:#b49aff;border-radius:13px}
.subbrand{color:#a99bc9}.status{background:#2c2445;color:#c7b5ff;border:1px solid #4b3c70}
.screen{padding:18px 18px 30px}
.screen h1{font-size:25px;letter-spacing:-.35px;color:#fff}
.screen h2{color:#f5f0ff}
.sub,.small,.footnote{color:#b9addb}
.card,.stat,.historyitem,.event,.modal,.taskrow,.timeline{background:#241d3b;border-color:#443568;color:#f5f0ff;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.field, input,select,textarea{background:#211a38!important;color:#f5f0ff!important;border:1px solid #493b70!important;border-radius:13px}
.field::placeholder,textarea::placeholder{color:#8f82b2}
.btn{background:#9274f6;color:#fff;border-radius:14px;font-weight:700}
.btn.secondary,.btn.ghost,.iconbtn{background:#392d62;color:#c8b5ff;border:1px solid #514078}
.pill{background:#392d62;color:#d8caff}
.tabs{background:#171127;border-top:1px solid #3a2e59}
.tabs button{color:#a99bc9}.tabs button.active{color:#b49aff}
.tabs button.active:before{background:#9b7cff}
.calday{background:#211a38;color:#d9cff5;border-color:#443568}
.calday.today,.calday.selected{background:#7055c5;color:white;border-color:#9b7cff}
.weekday{color:#a99bc9}
.hero{background:linear-gradient(135deg,#8e6df0,#6848d7);border-radius:22px;box-shadow:0 10px 25px rgba(0,0,0,.2)}
.empty{background:#211a38;border:1px dashed #514078}
.modalback{background:rgba(8,5,18,.78)}.modal{background:#211a38}
label{color:#c9bce7}
a{color:#b49aff}
@media(min-width:600px){.app{margin:18px auto;min-height:calc(100dvh - 36px);border:1px solid #443568;border-radius:28px;overflow:hidden}.tabs{border-radius:0 0 28px 28px}}

/* My Tasks: date-and-day grouping inspired by the supplied reference */
.tasks-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 22px}
.tasks-heading h1{margin:0 0 7px;font-size:29px}
.tasks-heading .sub{margin:0;max-width:300px}
.add-task-btn{white-space:nowrap;padding:13px 17px}
.tasks-search{margin:0 0 14px}
.tasks-table{border:1px solid #443568;border-radius:20px;overflow:hidden;background:#1d1731}
.tasks-table-head{display:grid;grid-template-columns:36% 64%;background:#392d62;color:#f4efff;font-weight:750;padding:15px 16px;font-size:14px}
.task-date-group{display:grid;grid-template-columns:36% 64%;border-top:1px solid #443568;padding:10px;gap:8px;align-items:stretch}
.task-date-cell{background:#2b2247;border:1px solid #493b70;border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0}
.task-date-cell strong{font-size:15px;color:#fff}
.task-date-cell span{font-size:13px;color:#a98aff;font-weight:650}
.task-group-items{display:flex;flex-direction:column;gap:5px;min-width:0}
.task-list-item{display:grid;grid-template-columns:9px minmax(70px,auto) minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:left;background:#241d3b;border:1px solid #34294f;border-radius:14px;padding:11px 9px;color:#f5f0ff;min-height:54px}
.task-list-item:active{background:#30264d}
.task-dot{width:8px;height:8px;border-radius:50%;background:#9b7cff}
.task-time{font-size:12px;font-weight:700;color:#eee8ff;background:#3a3154;border-radius:20px;padding:5px 8px;white-space:nowrap}
.task-title{font-size:13px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
.task-list-item .pill{font-size:11px;padding:5px 8px;white-space:nowrap}
.tasks-calendar-btn{margin-top:22px;min-height:58px;font-size:16px}
@media(max-width:380px){.tasks-table-head,.task-date-group{grid-template-columns:34% 66%}.task-date-group{padding:7px;gap:6px}.task-date-cell{padding:10px 8px}.task-date-cell strong{font-size:13px}.task-date-cell span{font-size:11px}.task-list-item{grid-template-columns:7px 1fr auto;gap:6px;padding:9px 7px}.task-time{grid-column:2;font-size:11px;justify-self:start}.task-title{grid-column:2;grid-row:2}.task-list-item .pill{grid-column:3;grid-row:1/3}.task-dot{grid-row:1/3}}

.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}.tabs button{font-size:10px;white-space:nowrap}

.schedule-table{width:100%;border-collapse:collapse;min-width:620px;margin:8px 0 2px;font-size:13px}
.schedule-table th,.schedule-table td{text-align:left;padding:10px 11px;border-bottom:1px solid #493b70;vertical-align:top}
.schedule-table th{color:#c6b7ec;font-weight:750;background:#211a38;position:sticky;top:0}
.schedule-table td{color:#f3efff}

/* v14.7 simple page-based desktop workspace */
html,body{height:100%;min-height:100%;overflow:hidden;background:#171127}
body{padding:0!important}
.app{width:100%;max-width:none;height:100dvh;min-height:0;max-height:none;margin:0;border:0!important;border-radius:0!important;box-shadow:none;overflow:hidden;background:#171127;display:flex;flex-direction:column}
.header{height:68px;min-height:68px;padding:10px 24px;background:#171127;border-bottom:1px solid #33284f;border-radius:0}
.workspace{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:0;flex:1;overflow:hidden}
.page-nav{display:flex;flex-direction:column;gap:5px;padding:18px 12px;background:#1c1630;border-right:1px solid #33284f;overflow:auto}
.page-nav button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:11px;background:transparent;color:#b9addb;font-size:13px;font-weight:650;min-height:43px}
.page-nav button span{width:20px;text-align:center;font-size:17px;color:#a995e9}
.page-nav button.active{background:#392d62;color:#fff}
.page-nav button.active span{color:#c7b5ff}
.screen{min-width:0;min-height:0;height:100%;overflow:auto;padding:24px clamp(18px,3vw,42px);overscroll-behavior:contain}
.screen>h1,.screen>.tasks-heading{max-width:1050px}
.screen>.card,.screen>section,.screen>.tasks-table,.screen>.tasks-search,.screen>.calendar,.screen>.sectionhead,.screen>.historyitem{max-width:1050px}
.screen .card{border-radius:14px;box-shadow:none}
.screen h1{font-size:24px}
.screen h2{font-size:16px}
.screen .hero{border-radius:15px;box-shadow:none}
.screen .field{background:#211a38!important}
#riyaConversation{max-height:260px;overflow:auto;padding-right:4px}
#riyaQuickNote{resize:none;min-height:74px;max-height:100px}
.modal{width:min(560px,100%);max-height:84dvh;border-radius:18px 18px 0 0}
@media(max-width:720px){
 .workspace{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 .page-nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:7px 9px;border-right:0;border-bottom:1px solid #33284f;gap:4px}
 .page-nav button{flex:0 0 auto;min-height:38px;padding:8px 11px;font-size:11px;gap:6px}
 .page-nav button span{font-size:14px;width:auto}
 .screen{padding:15px 13px 22px}
 .header{height:58px;min-height:58px;padding:8px 13px}
}
@media(min-width:721px){.screen{scrollbar-width:thin;scrollbar-color:#493b70 transparent}}


/* RIYA v15.2 — polished sporty workspace (same midnight-indigo / violet palette) */
:root{
 --bg:#151022;--card:#211a36;--ink:#f7f4ff;--mut:#aaa0c8;--p:#9b7cff;--pl:#342753;--ln:#3b3158;
 --shadow:0 14px 36px rgba(5,3,15,.22);--ease:cubic-bezier(.2,.75,.25,1)
}

.brand{font-size:16px;letter-spacing:1.8px}.logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#a58cff,#6748d5);color:#fff;font-size:21px;font-weight:900;box-shadow:0 7px 20px rgba(115,83,220,.28)}

</div>
<!-- Focused workspace: task capture, conversation and priority selection only. --></div><div id="modalRoot"></div><div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const STORE='riya_scheduler_v1';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const localISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const plusDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return localISO(d)};
const parseTime=t=>{if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(t||''))return null;const [h,m]=t.split(':').map(Number);return h*60+m};
const validISODate=s=>{if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T00:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===s};
const normTaskTitle=s=>String(s||'').trim().toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const timeText=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const prettyDate=(iso,opts={weekday:'short',day:'numeric',month:'short'})=>{if(!iso)return 'No date';const d=new Date(iso+'T12:00:00');return Number.isNaN(+d)?iso:d.toLocaleDateString('en-IN',opts)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const defaults={workStart:'07:00',workEnd:'22:00',buffer:10,notifications:false,reminderMinutes:10,weekStartsMonday:true};
const defaultRiyaCategories=[{id:'high_priority',label:'High-priority',description:'Things I enjoy doing and that contribute meaningfully to my growth across career, health, relationships, family, or other important areas.'},{id:'delegatable',label:'Delegatable',description:'Important tasks I dislike doing and could hand to another person, employee, friend, or suitable AI assistant.'},{id:'enjoyable_low_growth',label:'Enjoyable, low-growth',description:'Activities I enjoy, but that do not contribute much to my longer-term growth.'},{id:'detrimental',label:'Detrimental',description:'Activities I dislike that negatively affect my growth, focus, wellbeing, or progress.'}];
let state={conversationId:null,workingMemory:{},memoryVersion:0,conversationList:[],tab:'home',selectedDate:localISO(),calendarMonth:localISO().slice(0,7),tasks:[],history:[],settings:{...defaults},proposal:null,filter:'all',query:'',aiMessages:[],lastAiTasks:[],riyaPriorityPending:false,riyaScheduleReview:null};
function load(){try{const raw=localStorage.getItem(STORE);if(raw){const x=JSON.parse(raw);state={...state,...x,settings:{...defaults,...x.settings},proposal:null};}}catch(e){console.warn('RIYA storage could not be read',e);toast('Saved data could not be read. Your current session is still available.')}}
let dbReady=false,dbSyncTimer=null,dbSyncInFlight=false,dbSyncDirty=false,dbSyncFailed=false,dbRevision=null;
async function syncStateToDatabase(){
 if(!dbReady)return false;
 if(dbSyncInFlight){dbSyncDirty=true;return false;}
 dbSyncInFlight=true;dbSyncDirty=false;
 const makePayload=()=>({app:'RIYA',version:1,exportedAt:new Date().toISOString(),tasks:state.tasks,history:state.history,settings:state.settings});
 const mergeById=(remoteItems,localItems)=>{
  const merged=new Map();
  for(const item of (Array.isArray(remoteItems)?remoteItems:[]))if(item&&item.id)merged.set(String(item.id),item);
  for(const item of (Array.isArray(localItems)?localItems:[]))if(item&&item.id){
   const id=String(item.id),remote=merged.get(id);
   if(remote&&Array.isArray(remote.sessions)&&Array.isArray(item.sessions)){
    const sessions=new Map(remote.sessions.filter(x=>x&&x.id).map(x=>[String(x.id),x]));
    for(const session of item.sessions)if(session&&session.id)sessions.set(String(session.id),session);
    merged.set(id,{...remote,...item,sessions:[...sessions.values()]});
   }else merged.set(id,{...(remote||{}),...item});
  }
  return [...merged.values()];
 };
 try{
  for(let attempt=0;attempt<3;attempt++){
   const payload=makePayload();
   const response=await fetch('/api/db/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:payload,expected_revision:dbRevision})});
   const result=await response.json();
   if(response.status===409||result.conflict){
    if(attempt===2)throw new Error('RIYA database changed repeatedly while saving. Your browser backup is retained; retry after a moment.');
    const latestResponse=await fetch('/api/db/data',{cache:'no-store'});
    if(!latestResponse.ok)throw new Error('RIYA detected a database conflict but could not reload the latest database state.');
    const latest=await latestResponse.json();
    if(!Number.isInteger(latest.revision))throw new Error('RIYA could not read the latest database revision.');
    // Preserve both sides: keep browser edits, add database-only records, and merge sessions by ID.
    state.tasks=mergeById(latest.tasks,state.tasks);
    state.history=mergeById(latest.history,state.history).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||''))).slice(0,500);
    state.settings={...defaults,...(latest.settings||{}),...(state.settings||{})};
    dbRevision=latest.revision;
    try{localStorage.setItem(STORE,JSON.stringify({...state,proposal:null}));}catch(_){}
    continue;
   }
   if(!response.ok||!result.ok||!result.verified)throw new Error(result.error||'SQLite did not verify the save.');
   const verified=result.database;
   if(!Number.isInteger(result.revision))throw new Error('SQLite did not return a valid database revision.');
   dbRevision=result.revision;
   if(!Array.isArray(verified.tasks)||verified.tasks.length!==payload.tasks.length)throw new Error('SQLite task read-back count did not match.');
   dbSyncFailed=false;
   return true;
  }
  throw new Error('RIYA could not complete database sync.');
 }catch(error){
  dbSyncFailed=true;console.error('RIYA SQLite sync failed:',error);
  toast('Database sync failed. Your browser backup remains available; check the RIYA server.');
  return false;
 }finally{
  dbSyncInFlight=false;
  if(dbSyncDirty){dbSyncDirty=false;syncStateToDatabase();}
 }
}
function persist(){
 try{
  localStorage.setItem(STORE,JSON.stringify({...state,proposal:null}));
  if(dbReady){clearTimeout(dbSyncTimer);dbSyncTimer=setTimeout(syncStateToDatabase,180);}
  return true;
 }catch(e){toast('Could not save. Browser storage may be full or disabled.');return false}
}
// Critical mutations call this before reporting success. It drains queued snapshot writes
// and requires SQLite read-back verification; localStorage alone is not treated as a commit.
async function persistAndVerify(){
 clearTimeout(dbSyncTimer);
 if(!dbReady){
  const deadline=Date.now()+10000;
  while(!dbReady&&Date.now()<deadline)await new Promise(resolve=>setTimeout(resolve,100));
 }
 if(!dbReady)throw new Error('RIYA database is not ready. Your browser backup is retained; retry after the database reconnects.');
 for(let attempt=0;attempt<4;attempt++){
  while(dbSyncInFlight)await new Promise(resolve=>setTimeout(resolve,25));
  dbSyncDirty=false;
  const ok=await syncStateToDatabase();
  if(!ok)throw new Error('SQLite could not confirm this save. Your browser backup is retained.');
  while(dbSyncInFlight)await new Promise(resolve=>setTimeout(resolve,25));
  if(!dbSyncDirty)return true;
 }
 throw new Error('RIYA is still syncing another change. Please retry once syncing finishes.');
}
async function bootstrapDatabase(){
 try{
  const response=await fetch('/api/db/data',{cache:'no-store'});
  if(!response.ok)throw new Error('Could not read the RIYA database.');
  const remote=await response.json();
  const localRaw=localStorage.getItem(STORE);
  const local=localRaw?JSON.parse(localRaw):null;
  const remoteTasks=Array.isArray(remote.tasks)?remote.tasks:[];
  if(remoteTasks.length===0&&local&&Array.isArray(local.tasks)&&local.tasks.length){
   const backup={app:'RIYA',version:1,exportedAt:new Date().toISOString(),tasks:local.tasks,history:local.history||[],settings:local.settings||defaults};
   const imported=await fetch('/api/db/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:backup,expected_revision:Number.isInteger(remote.revision)?remote.revision:0})});
   const result=await imported.json();
   if(!imported.ok||!result.ok||!result.verified)throw new Error(result.error||'Legacy browser data migration failed.');
   state={...state,...local,settings:{...defaults,...(result.database.settings||local.settings||{})},tasks:result.database.tasks||local.tasks,history:result.database.history||local.history||[],proposal:null};
   dbRevision=result.revision;
  }else{
   state={...state,tasks:remoteTasks,history:remote.history||[],settings:{...defaults,...(remote.settings||{})},proposal:null};
   try{localStorage.setItem(STORE,JSON.stringify({...state,proposal:null}));}catch(_){}
  }
  dbRevision=Number.isInteger(dbRevision)?dbRevision:(Number.isInteger(remote.revision)?remote.revision:0);
  dbReady=true;try{const categoryResponse=await fetch('/api/riya/categories',{cache:'no-store'});if(categoryResponse.ok){const categoryData=await categoryResponse.json();state.settings.riya_categories=Array.isArray(state.settings.riya_categories)?state.settings.riya_categories:categoryData.categories;}}catch(categoryError){console.warn('Could not load RIYA category settings:',categoryError)}await bootstrapConversation();render();
 }catch(error){
  console.error('RIYA database bootstrap failed:',error);
  toast('SQLite is unavailable. RIYA is using the existing browser data for this session.');
 }
}
async function bootstrapConversation(){
 const listRes=await fetch('/api/conversations',{cache:'no-store'});if(!listRes.ok)throw new Error('Could not load saved conversations.');
 const listData=await listRes.json(),items=Array.isArray(listData.conversations)?listData.conversations:[];state.conversationList=items;
 if(items.length){
  const latest=items[0],res=await fetch('/api/conversations/'+encodeURIComponent(latest.id),{cache:'no-store'});if(!res.ok)throw new Error('Could not restore conversation.');
  const bundle=await res.json();state.conversationId=latest.id;
  state.aiMessages=(bundle.messages||[]).filter(m=>['user','assistant'].includes(m.role)).map(m=>({id:m.id,turn_id:m.turn_id||null,role:m.role,content:m.content}));
  state.workingMemory=bundle.working_memory||{};state.memoryVersion=Number(bundle.memory_version)||0;
  if(Array.isArray(state.workingMemory.draft_tasks))state.lastAiTasks=state.workingMemory.draft_tasks;
  state.riyaPriorityPending=!!state.workingMemory.priority_pending;state.riyaScheduleReview=state.workingMemory.schedule_preview||null;
 }else{
  const memory={draft_tasks:Array.isArray(state.lastAiTasks)?state.lastAiTasks:[],priority_pending:!!state.riyaPriorityPending,schedule_preview:state.riyaScheduleReview||null};
  const res=await fetch('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'RIYA conversation',messages:Array.isArray(state.aiMessages)?state.aiMessages:[],working_memory:memory})});
  const created=await res.json();if(!res.ok||!created.ok)throw new Error(created.error||'Could not create conversation.');
  state.conversationId=created.conversation_id;state.workingMemory=memory;state.memoryVersion=1;state.conversationList=[{id:created.conversation_id,title:'RIYA conversation',updated_at:new Date().toISOString(),message_count:legacyMessages.length}];
 }
 // Repair planner records from previously saved conversation working memory.
 // This makes tasks captured before the planner sync fix visible after an upgrade.
 if(Array.isArray(state.lastAiTasks)&&state.lastAiTasks.length){
  await syncRiyaTasksToPlanner(state.lastAiTasks);
  persist();
  try{await persistAndVerify();}catch(error){console.warn('Conversation task recovery could not be verified in SQLite:',error);}
 }
 try{localStorage.setItem(STORE,JSON.stringify({...state,proposal:null}));}catch(_){}
}
async function startNewConversation(){
 const res=await fetch('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'New conversation',working_memory:{draft_tasks:[],priority_pending:false,schedule_preview:null}})});
 const data=await res.json();if(!res.ok||!data.ok){toast(data.error||'Could not start a new conversation.');return;}
 state.conversationId=data.conversation_id;state.aiMessages=[];state.lastAiTasks=[];state.lastAiQuestions=[];state.riyaPriorityPending=false;state.riyaScheduleReview=null;state.workingMemory={draft_tasks:[],priority_pending:false,schedule_preview:null};
 const list=await fetch('/api/conversations',{cache:'no-store'});if(list.ok)state.conversationList=(await list.json()).conversations||[];
 state.tab='home';persist();render();toast('Started a new conversation. Your previous chat is saved.');
}
async function openSavedConversation(id){
 const res=await fetch('/api/conversations/'+encodeURIComponent(id),{cache:'no-store'});const data=await res.json();if(!res.ok){toast(data.error||'Could not open conversation.');return;}
 state.conversationId=id;state.aiMessages=(data.messages||[]).filter(m=>['user','assistant'].includes(m.role)).map(m=>({id:m.id,turn_id:m.turn_id||null,role:m.role,content:m.content}));state.workingMemory=data.working_memory||{};state.memoryVersion=Number(data.memory_version)||0;
 state.lastAiTasks=Array.isArray(state.workingMemory.draft_tasks)?state.workingMemory.draft_tasks:[];state.riyaPriorityPending=!!state.workingMemory.priority_pending;state.riyaScheduleReview=state.workingMemory.schedule_preview||null;
 state.tab='home';persist();render();toast('Conversation restored.');
}
async function saveConversationMessage(role,content,turnId=null){
 if(!state.conversationId)return false;const id=uid();const res=await fetch('/api/conversations/'+encodeURIComponent(state.conversationId)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,turn_id:turnId,role,content})});if(!res.ok)throw new Error('Could not save conversation message.');return true;
}
function log(action,detail){state.history.unshift({id:uid(),at:new Date().toISOString(),action,detail});state.history=state.history.slice(0,500);persist()}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)}
async function navigate(tab){state.tab=tab;if(tab==='history'){try{const r=await fetch('/api/conversations',{cache:'no-store'});if(r.ok)state.conversationList=(await r.json()).conversations||[]}catch(e){console.warn('Conversation list refresh failed',e)}}persist();render()}
function refreshRiyaApp(){
 if(!window.confirm('Clear RIYA and start fresh? This removes all tasks, priorities and conversation saved in this browser.'))return;
 if(window.speechSynthesis)window.speechSynthesis.cancel();
 if(riyaRecognition){try{riyaRecognition.stop()}catch(e){}riyaRecognition=null;}
 localStorage.removeItem(STORE);
 state={tab:'home',selectedDate:localISO(),calendarMonth:localISO().slice(0,7),tasks:[],history:[],settings:{...defaults},proposal:null,filter:'all',query:'',aiMessages:[],lastAiTasks:[],lastAiQuestions:[],riyaPriorityPending:false,riyaScheduleReview:null};
 riyaLastReply='';riyaSpeaking=false;render();updateSpeakButton();toast('All RIYA data cleared. Fresh start!');
}
function activeTasks(){return state.tasks.filter(t=>t.status!=='cancelled')}
function taskSessions(t){if(Array.isArray(t.sessions)&&t.sessions.length)return t.sessions;return t.status==='scheduled'&&t.date&&t.start&&t.end?[{id:t.id+'-legacy',date:t.date,start:t.start,end:t.end,duration:Number(t.duration)||parseTime(t.end)-parseTime(t.start),status:'scheduled'}]:[]}
function allScheduledSessions(){return activeTasks().flatMap(t=>taskSessions(t).filter(x=>!['cancelled','rescheduled'].includes(x.status)).map(x=>({...x,taskId:t.id,title:t.title,status:t.status==='completed'&&x.status==='scheduled'?'completed':(x.status||t.status||'scheduled')})))}
function scheduledOn(date){return allScheduledSessions().filter(x=>x.date===date).sort((a,b)=>a.start.localeCompare(b.start))}
function overlaps(a,b){return a.start<b.end&&b.start<a.end}
function taskLabel(t){return `${t.title} · ${t.start||'Unscheduled'}${t.end?'–'+t.end:''}`}
function priorityClass(p){return p==='High'?'high':p==='Medium'?'medium':'low'}
function formatDuration(n){const h=Math.floor(n/60),m=n%60;return h?`${h}h${m?` ${m}m`:''}`:`${m}m`}
function render(){
 const pages={home:homeView,tasks:tasksView,schedule:scheduleView,calendar:calendarView,history:historyView,settings:settingsView};
 $('screen').innerHTML=(pages[state.tab]||homeView)();
 document.querySelectorAll('.page-nav button').forEach(button=>button.classList.toggle('active',button.dataset.page===state.tab));
 if(state.tab==='home'){
  renderRiyaConversation();
  renderRiyaTaskSuggestions();
 }
 updateSpeakButton();
}
function scheduleView(){
 const plan=state.riyaScheduleReview;
 const saved=allScheduledSessions().sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')));
 const draft=activeTasks().filter(t=>t.status==='pending'&&!taskSessions(t).some(x=>x.status==='scheduled')).map(t=>({title:t.title,date:t.date||'',start_time:t.start||'',duration_minutes:t.duration||0,priority:t.priority,task_id:t.ai_task_id||t.id}));
 let proposal='';
 if(plan&&plan.entries?.length){
  proposal=`<section class="card" style="margin-top:12px;border-color:#8065c8">
   <div class="row between"><b>Proposed schedule</b><span class="pill">Awaiting your review</span></div>
   <p class="small">Check the dates and time slots. Nothing here has been saved yet.</p>
   <div style="overflow-x:auto"><table class="schedule-table"><thead><tr><th>Date</th><th>Task</th><th>Start</th><th>End</th><th>Duration</th></tr></thead><tbody>
   ${plan.entries.map(x=>`<tr><td>${esc(prettyDate(x.date))}</td><td>${esc(x.title)}</td><td>${esc(formatTime(x.start_time))}</td><td>${esc(formatTime(x.end_time))}</td><td>${esc(formatDuration(Number(x.duration_minutes)))}</td></tr>`).join('')}
   </tbody></table></div>
   ${plan.conflicts?.length?`<div class="notice dangertext">${plan.conflicts.map(esc).join('<br>')}</div>`:''}
   <div class="actions"><button class="btn ghost" onclick="discardRiyaBatchSchedule()">Discard proposal</button><button class="btn" ${plan.conflicts?.length?'disabled':''} onclick="approveRiyaBatchSchedule()">Approve & save</button></div>
  </section>`;
 }else if(plan?.needs_clarification){proposal=`<section class="card" style="margin-top:12px"><b>Schedule needs clarification</b><p class="small">${esc(plan.clarification||'Please clarify which tasks to include.')}</p></section>`;}
 else proposal=`<section class="card" style="margin-top:12px"><b>No schedule proposal yet</b><p class="small">Tell RIYA in the conversation which task to place, when it should happen, and how much time to reserve. The proposal will appear here for review.</p></section>`;
 const savedHtml=saved.length?`<section class="card" style="margin-top:12px"><div class="row between"><b>Saved schedule</b><span class="pill">${saved.length} session${saved.length===1?'':'s'}</span></div><div style="overflow-x:auto"><table class="schedule-table"><thead><tr><th>Date</th><th>Task</th><th>Start</th><th>End</th><th>Duration</th><th>Status</th></tr></thead><tbody>${saved.map(t=>`<tr><td>${esc(prettyDate(t.date))}</td><td>${esc(t.title)}</td><td>${esc(formatTime(t.start))}</td><td>${esc(formatTime(t.end))}</td><td>${esc(formatDuration(Number(t.duration)||0))}</td><td><span class="pill" style="color:${t.status==='completed'?'#83dfb5':t.status==='cancelled'?'#ff9a9a':'#b49aff'}">${esc(t.status||'scheduled')}</span></td></tr>`).join('')}</tbody></table></div></section>`:`<section class="card" style="margin-top:12px"><b>Saved schedule</b><p class="small">Approved sessions will appear here in a date-and-time table.</p></section>`;
 const draftsHtml=draft.length?`<section class="card" style="margin-top:12px"><b>Tasks not scheduled yet</b>${draft.map(t=>`<div class="small" style="padding:7px 0;border-top:1px solid #493b70">${esc(t.title)} · ${t.date?esc(prettyDate(t.date)):'Date not set'} · ${t.start_time?esc(formatTime(t.start_time)):'Time not set'}</div>`).join('')}</section>`:'';
 return `<div style="margin:0 0 14px"><button class="btn secondary full" style="display:block;width:100%;text-align:left;padding:13px 16px;font-size:14px" onclick="navigate('home')" aria-label="Back to RIYA conversation">←&nbsp; Back to conversation</button></div><div style="margin:4px 0 14px"><div class="small" style="color:#b49aff;font-weight:800;letter-spacing:1px">RIYA PLANNER</div><h1 style="font-size:26px;margin:5px 0">Schedule &amp; review</h1><p class="small">Review proposed slots and see everything you've saved.</p></div>${proposal}${savedHtml}${draftsHtml}<p class="footnote" style="text-align:center;margin-top:12px">RIYA understands first. You decide what happens next.</p>`;
}

async function syncRiyaTasksToPlanner(drafts){
 const items=Array.isArray(drafts)?drafts:[];
 for(const d of items){
  if(!d||!d.title)continue;

   const matches=state.tasks.filter(t=>normTaskTitle(t.title)===normTaskTitle(title)&&t.status!=='cancelled');
   if(matches.length===1)saved=matches[0];
  }

  }else{
   saved.ai_task_id=saved.ai_task_id||d.task_id||uid(); d.task_id=saved.ai_task_id;
   saved.title=title;

   if(d.notes)saved.notes=d.notes;
  }
 }
}
function commitRiyaSchedule(plan,drafts){
 if(!plan||!Array.isArray(plan.entries)||!plan.entries.length||plan.needs_clarification||plan.conflicts?.length)return {ok:false,reason:'The proposal needs clarification or has conflicts.'};
 const entries=plan.entries.map(x=>{const start=parseTime(x.start_time),end=parseTime(x.end_time),duration=Number(x.duration_minutes);return {...x,start,end,duration,title:String(x.title||'').trim()};});
 if(entries.some(x=>!x.title||!validISODate(x.date)||x.date<localISO()||x.start===null||x.end===null||x.end<=x.start||!Number.isFinite(x.duration)||x.duration<=0||x.end-x.start!==x.duration))return {ok:false,reason:'One or more proposed sessions have an invalid calendar date, time or duration.'};

 const snapshot=JSON.parse(JSON.stringify(state));
 const expected=[];
 try{
  for(const x of entries){
   let task=x.task_id?state.tasks.find(t=>t.ai_task_id===x.task_id||t.id===x.task_id):null;
   if(!task){const matches=state.tasks.filter(t=>normTaskTitle(t.title)===normTaskTitle(x.title)&&t.status!=='cancelled');if(matches.length>1)throw new Error(`More than one task is named “${x.title}”. Please select the exact task before scheduling.`);task=matches[0]||null;}
   if(task&&['completed','cancelled'].includes(task.status))throw new Error(`“${task.title}” is ${task.status} and cannot be scheduled.`);
   if(!task){task={id:uid(),ai_task_id:x.task_id||uid(),title:x.title,date:'',duration:x.duration,priority:'Medium',kind:'fixed',start:'',end:'',deadline:'',preferred:'Anytime',notes:'',status:'pending',createdAt:new Date().toISOString(),completedAt:null,sessions:[]};state.tasks.push(task);}
   task.sessions=Array.isArray(task.sessions)?task.sessions:[];
   if(task.status==='scheduled'&&task.date&&task.start&&task.end&&!task.sessions.length)task.sessions.push({id:task.id+'-legacy',date:task.date,start:task.start,end:task.end,duration:Number(task.duration)||parseTime(task.end)-parseTime(task.start),status:'scheduled'});
   const duplicate=task.sessions.find(z=>z.date===x.date&&z.start===x.start_time&&z.end===x.end_time&&z.status!=='cancelled');
   if(!duplicate){
    const clash=allScheduledSessions().find(z=>z.status==='scheduled'&&z.date===x.date&&parseTime(z.start)!==null&&parseTime(z.end)!==null&&x.start<parseTime(z.end)&&x.end>parseTime(z.start));
    if(clash)throw new Error(`${x.date} ${x.start_time}–${x.end_time} overlaps with ${clash.title}.`);
    task.sessions.push({id:uid(),date:x.date,start:x.start_time,end:x.end_time,duration:x.duration,status:'scheduled'});
   }
   task.status='scheduled';task.kind='fixed';task.duration=task.duration||x.duration;
   if(!task.date||x.date<task.date){task.date=x.date;task.start=x.start_time;task.end=x.end_time;}
   expected.push({taskId:task.id,date:x.date,start:x.start_time,end:x.end_time});
  }
  for(const d of drafts||[]){const matches=entries.filter(x=>(x.task_id&&x.task_id===d.task_id)||normTaskTitle(x.title)===normTaskTitle(d.title));if(matches.length){d.scheduled=true;d.schedule_status='scheduled';d.scheduled_instances=matches.map(x=>({title:x.title,date:x.date,start_time:x.start_time,end_time:x.end_time,duration_minutes:x.duration}));}}
  state.riyaScheduleReview=null;state.proposal=null;
  state.history.unshift({id:uid(),at:new Date().toISOString(),action:'Schedule approved',detail:`${expected.length} session(s) saved`});state.history=state.history.slice(0,500);
  if(!persist())throw new Error('Storage save failed');
  const stored=JSON.parse(localStorage.getItem(STORE)||'{}');
  const verified=expected.every(e=>(stored.tasks||[]).some(t=>t.id===e.taskId&&Array.isArray(t.sessions)&&t.sessions.some(z=>z.date===e.date&&z.start===e.start&&z.end===e.end&&z.status==='scheduled')));
  if(!verified)throw new Error('Saved data verification failed');
  return {ok:true,count:expected.length};
 }catch(err){
  state=snapshot;
  try{localStorage.setItem(STORE,JSON.stringify({...state,proposal:null}));}catch(e){}
  return {ok:false,reason:err.message||'Save verification failed; all changes were rolled back.'};
 }
}

function commitRiyaScheduledTask(drafts){
 const t=(drafts||[]).find(x=>x.priority_rank===1&&!x.scheduled);
 if(!t||!t.date||!t.start_time||!t.end_time||!t.duration_minutes)return {ok:false,message:"I have the date and start time, but still need the time block to be clear before adding it."};

 if(!result.ok)return {ok:false,message:result.reason||'I could not save that task.'};

 return {ok:true};
}

async function saveTask(e,id){e.preventDefault();const title=$('taskTitle').value.trim(),date=$('taskDate').value,duration=Number($('taskDuration').value),priority=$('taskPriority').value,kind=$('taskKind').value,start=$('taskStart').value,end=$('taskEnd').value,deadline=$('taskDeadline').value;if(!title||!validISODate(date)||!duration||!priority){toast('Please enter a valid calendar date, title, duration and priority.');return}if(duration<5||duration>1440){toast('Duration must be between 5 minutes and 24 hours.');return}if(deadline&&(!validISODate(deadline)||deadline<date)){toast('Deadline must be a valid date on or after the planned date.');return}if(kind==='fixed'){const a=parseTime(start),b=parseTime(end);if(a===null||b===null||b<=a||b-a!==duration){toast('For a fixed commitment, end time must be after start and match the duration.');return}}

 const duplicate=activeTasks().find(x=>x.date===date&&x.title.trim().toLowerCase()===title.toLowerCase());if(duplicate){showModal(`<div class="modalhead"><h2>Possible duplicate</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><p>There is already a task named <b>${esc(duplicate.title)}</b> on ${prettyDate(date)}.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn secondary" onclick="closeModal();openTaskForm('${duplicate.id}')">Review existing task</button></div>`);return}const task={id:uid(),...data,status:'pending',createdAt:new Date().toISOString(),completedAt:null};state.tasks.push(task);persist();try{await persistAndVerify()}catch(error){state.tasks=state.tasks.filter(x=>x.id!==task.id);persist();toast(error.message);return}log('Task added',`${title} · ${prettyDate(date)} · ${priority} priority · ${formatDuration(duration)}`);closeModal();state.tab='tasks';state.selectedDate=date;render();toast('Task collected. Build a schedule when ready.')}

function cancelTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;showModal(`<div class="modalhead"><h2>Cancel task?</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><p>“${esc(t.title)}” will be marked cancelled. The history will be retained.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Keep task</button><button class="btn danger" onclick="setTaskStatus('${id}','cancelled')">Cancel task</button></div>`)}
function findSlot(task,occupied,settings){const dayStart=parseTime(settings.workStart),dayEnd=parseTime(settings.workEnd);if(dayStart===null||dayEnd===null||dayEnd<=dayStart)return null;const dur=task.duration,buffer=Number(settings.buffer)||0;const preferred={Morning:[dayStart,720],Afternoon:[720,1020],Evening:[1020,dayEnd],Anytime:[dayStart,dayEnd]}[task.preferred]||[dayStart,dayEnd];const ranges=[[Math.max(dayStart,preferred[0]),Math.min(dayEnd,preferred[1])],[dayStart,dayEnd]];const candidates=[];for(const [lo,hi] of ranges){for(let s=Math.ceil(lo/15)*15;s+dur<=hi;s+=15){const candidate={start:timeText(s),end:timeText(s+dur)};const clash=occupied.some(o=>{const a=parseTime(o.start),b=parseTime(o.end),cs=s,ce=s+dur;return a!==null&&b!==null&&cs<b+buffer&&ce>a-buffer});if(!clash)candidates.push({s,score:Math.abs((s+dur/2)-((preferred[0]+preferred[1])/2))});}if(candidates.length)break;}candidates.sort((a,b)=>a.score-b.score||a.s-b.s);return candidates.length?{start:timeText(candidates[0].s),end:timeText(candidates[0].s+dur)}:null}
function buildProposal(singleId=null){const date=state.selectedDate,tasks=activeTasks().filter(t=>t.date===date&&t.status==='pending'&&(!singleId||t.id===singleId));if(!tasks.length){toast('No unscheduled tasks for this date.');return}const fixed=tasks.filter(t=>t.kind==='fixed'),flex=tasks.filter(t=>t.kind==='flexible').sort((a,b)=>({High:0,Medium:1,Low:2}[a.priority]-{High:0,Medium:1,Low:2}[b.priority])||(a.deadline||'9999').localeCompare(b.deadline||'9999'));const occupied=scheduledOn(date).filter(t=>t.status==='scheduled').map(t=>({id:t.taskId,start:t.start,end:t.end,title:t.title}));const proposed=[],conflicts=[],unplaced=[];if(date<localISO())conflicts.push({message:'This date is in the past. Choose a future date before scheduling.',taskId:tasks[0]?.id,otherId:null});for(const t of [...fixed,...flex]){if(t.deadline&&date>t.deadline)conflicts.push({message:`${t.title}: planned date is later than its deadline (${prettyDate(t.deadline)}).`,taskId:t.id,otherId:null})}for(const t of fixed){const a=parseTime(t.start),b=parseTime(t.end);if(a===null||b===null||b<=a){conflicts.push({message:`${t.title}: invalid fixed time.`,taskId:t.id,otherId:null});continue}const hit=occupied.find(o=>{const x=parseTime(o.start),y=parseTime(o.end);return a<y&&b>x});const hit2=proposed.find(o=>a<parseTime(o.end)&&b>parseTime(o.start));if(hit||hit2){conflicts.push({message:`${t.title} overlaps with ${(hit||hit2).title}. Choose which item to change.`,taskId:t.id,otherId:(hit||hit2).id||null});continue}proposed.push({...t});occupied.push({id:t.id,start:t.start,end:t.end,title:t.title})}
 for(const t of flex){const slot=findSlot(t,occupied,state.settings);if(!slot){unplaced.push(t.title);proposed.push({...t,start:'',end:''});continue}proposed.push({...t,...slot});occupied.push({start:slot.start,end:slot.end,title:t.title})}
 state.proposal={type:'schedule',date,items:proposed,conflicts,unplaced};render();setTimeout(()=>$('proposal')?.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
async function approveProposal(){const p=state.proposal;if(!p||p.type!=='schedule')return;if(p.conflicts.length||p.unplaced.length){toast('Resolve all conflicts and unscheduled tasks first.');return}const entries=p.items.map(item=>({task_id:item.id,title:item.title,date:p.date,start_time:item.start,end_time:item.end,duration_minutes:parseTime(item.end)-parseTime(item.start)}));const result=commitRiyaSchedule({entries,conflicts:[]},[]);if(!result.ok){toast(result.reason);return}try{await persistAndVerify()}catch(error){toast(error.message);return}state.selectedDate=p.date;render();toast('Schedule approved, saved and verified.')}
function discardProposal(){state.proposal=null;render();toast('Proposal discarded. No changes were saved.')}
function proposeMove(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;showModal(`<div class="modalhead"><h2>Move scheduled task</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><p class="small">Choose a new date and time. The current slot remains protected until you approve.</p><form onsubmit="submitMove(event,'${id}')"><label>New date</label><input class="field" id="moveDate" type="date" required value="${t.date}"><label>New start time</label><input class="field" id="moveStart" type="time" required value="${t.start}"><label>New end time</label><input class="field" id="moveEnd" type="time" required value="${t.end}"><div class="actions"><button class="btn ghost" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Review move</button></div></form>`)}
function submitMove(e,id){e.preventDefault();const t=state.tasks.find(x=>x.id===id),date=$('moveDate').value,start=$('moveStart').value,end=$('moveEnd').value,a=parseTime(start),b=parseTime(end);if(!t||!validISODate(date)||date<localISO()||a===null||b===null||b<=a||b-a!==Number(t.duration)){toast('Choose a valid future date and an end time matching the task duration.');return}const conflict=activeTasks().find(x=>x.id!==id&&x.date===date&&x.start&&x.end&&overlaps({start,end},{start:x.start,end:x.end}));if(conflict){showModal(`<div class="modalhead"><h2>Schedule overlap detected</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="notice dangertext">Your proposed time for <b>${esc(t.title)}</b> overlaps with <b>${esc(conflict.title)}</b>.</div><p>Which item would you like to review? RIYA will not move either item automatically.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Choose another time</button><button class="btn secondary" onclick="closeModal();openTaskForm('${conflict.id}')">Review existing task</button></div>`);return}showModal(`<div class="modalhead"><h2>Approve move?</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="card"><b>${esc(t.title)}</b><p class="small">Current: ${prettyDate(t.date)} · ${t.start}–${t.end}</p><p>Proposed: ${prettyDate(date)} · ${start}–${end}</p></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Keep current</button><button class="btn" onclick="approveMove('${id}','${date}','${start}','${end}')">Approve move</button></div>`)}
async function approveMove(id,date,start,end){const t=state.tasks.find(x=>x.id===id);if(!t||['completed','cancelled'].includes(t.status)){toast('This task cannot be moved in its current status.');return}if(!validISODate(date)||date<localISO()||parseTime(start)===null||parseTime(end)===null||parseTime(end)<=parseTime(start)||parseTime(end)-parseTime(start)!==Number(t.duration)){toast('Please choose a valid date and time matching the task duration.');return}const snapshot=JSON.parse(JSON.stringify(state));try{t.sessions=Array.isArray(t.sessions)?t.sessions:[];if(t.status==='scheduled'&&t.date&&t.start&&t.end&&!t.sessions.length)t.sessions.push({id:t.id+'-legacy',date:t.date,start:t.start,end:t.end,duration:Number(t.duration),status:'scheduled'});const current=t.sessions.find(s=>s.status==='scheduled'&&(s.date===t.date&&s.start===t.start&&s.end===t.end));const clash=allScheduledSessions().find(s=>s.status==='scheduled'&&s.id!==current?.id&&s.date===date&&parseTime(s.start)<parseTime(end)&&parseTime(s.end)>parseTime(start));if(clash)throw new Error(`Overlaps with ${clash.title}.`);if(current)current.status='rescheduled';t.sessions.push({id:uid(),date,start,end,duration:Number(t.duration),status:'scheduled'});t.date=date;t.start=start;t.end=end;t.status='scheduled';state.history.unshift({id:uid(),at:new Date().toISOString(),action:'Task moved',detail:`${t.title}: ${prettyDate(date)} ${start}–${end}`});if(!persist())throw new Error('Could not save the move.');await persistAndVerify();const stored=JSON.parse(localStorage.getItem(STORE)||'{}');if(!(stored.tasks||[]).some(x=>x.id===t.id&&x.sessions?.some(s=>s.date===date&&s.start===start&&s.end===end&&s.status==='scheduled')))throw new Error('Move verification failed.')}catch(err){state=snapshot;try{localStorage.setItem(STORE,JSON.stringify({...state,proposal:null}))}catch(e){}toast(err.message);return}closeModal();state.selectedDate=date;render();toast('Move saved and verified.')}
function proposeEdit(id){openTaskForm(id)}
function showModal(html){$('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
async function saveRiyaCategories(){const current=Array.isArray(state.settings.riya_categories)?state.settings.riya_categories:defaultRiyaCategories;const categories=current.map(c=>{const label=document.querySelector(`.riya-category-label[data-category-id=\"${c.id}\"]`)?.value.trim()||'';const description=document.querySelector(`.riya-category-description[data-category-id=\"${c.id}\"]`)?.value.trim()||'';return {...c,label,description}});if(categories.some(c=>!c.label||!c.description)){toast('Each category needs a name and definition.');return}try{const response=await fetch('/api/riya/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({categories})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Could not save categories.');state.settings.riya_categories=result.categories;persist();await persistAndVerify();log('Task categories updated','Updated the four RIYA task category definitions.');render();toast('Your four task categories are saved.')}catch(error){toast(error.message||'Could not save categories.')}}
function saveSettings(){const start=$('workStart').value,end=$('workEnd').value,buffer=Number($('buffer').value);if(parseTime(start)===null||parseTime(end)===null||parseTime(end)<=parseTime(start)){toast('End of day must be later than start.');return}if(!Number.isInteger(buffer)||buffer<0||buffer>120){toast('Buffer must be between 0 and 120 minutes.');return}state.settings={...state.settings,workStart:start,workEnd:end,buffer};persist();log('Settings updated',`Working hours ${start}–${end}; buffer ${buffer} min`);toast('Settings saved.')}
async function toggleNotifications(on){state.settings.notifications=!!on;persist();try{await persistAndVerify();toast(on?'Background reminders enabled. Install the RIYA reminder worker to receive alerts while Edge is closed.':'Background reminders disabled.')}catch(error){state.settings.notifications=!on;$('notifications').checked=!on;toast(error.message)}}
async function saveReminderSettings(){const n=Number($('reminderMinutes').value);if(!Number.isInteger(n)||n<0||n>120){toast('Reminder lead time must be 0–120 minutes.');return}state.settings.reminderMinutes=n;persist();try{await persistAndVerify();toast('Reminder settings saved and verified.')}catch(error){toast(error.message)}}

function checkReminders(){return;}
function exportData(){const data={app:'RIYA',version:1,exportedAt:new Date().toISOString(),tasks:state.tasks,history:state.history,settings:state.settings};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`riya-backup-${localISO()}.json`;a.click();URL.revokeObjectURL(url);toast('Backup exported.')}
async function applyImport(d){if(!d)return;state.tasks=d.tasks;state.history=d.history;state.settings={...defaults,...(d.settings||{})};state.proposal=null;persist();try{await persistAndVerify()}catch(error){toast(error.message);return}closeModal();render();toast('Backup imported and verified in SQLite.')}
function confirmClearData(){showModal(`<div class="modalhead"><h2>Clear all RIYA data?</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="notice dangertext">This permanently removes tasks, history and settings stored in this browser. Export a backup first if needed.</div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="clearData()">Clear all data</button></div>`)}
async function clearData(){state={tab:'home',selectedDate:localISO(),calendarMonth:localISO().slice(0,7),tasks:[],history:[],settings:{...defaults},proposal:null,filter:'all',query:'',aiMessages:[],lastAiTasks:[]};localStorage.removeItem(STORE);if(!persist()){toast('Could not clear saved browser data.');return;}try{await persistAndVerify()}catch(error){toast(error.message);return}closeModal();render();toast('Local RIYA data cleared in browser and SQLite.')}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='RIYA'||!Array.isArray(d.tasks)||!Array.isArray(d.history))throw Error('Invalid RIYA backup');window.__riyaImport=d;showModal(`<div class="modalhead"><h2>Import backup?</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><p>This replaces the tasks, history and settings currently stored in this browser.</p><div class="notice">Export your current data first if you want to keep it.</div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="applyImport(window.__riyaImport)">Import backup</button></div>`)}catch(err){toast(err.message||'Could not import backup')}};r.readAsText(f);e.target.value=''}
// Conversation is handled by the local RIYA backend and Ollama; scheduling remains approval-driven.
load();render();bootstrapDatabase();setInterval(checkReminders,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
